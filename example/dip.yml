version: '7.1'

# Define default environment variables to pass
# to Docker Compose
environment:
  # Override ports on the fly to run multiple copies of the app
  # (can be used by worktrees or clones)
  RAILS_PORT: 3000
  VITE_PORT: 3036

compose:
  files:
    - .dockerdev/compose.yml
  project_name: example_demo

interaction:
  # This command spins up a Rails container with the required dependencies (such as databases),
  # and opens a terminal within it.
  runner:
    description: Open a Bash shell within a Rails container (with dependencies up)
    service: rails
    command: /bin/bash

  # Run a Rails container without any dependent services (useful for non-Rails scripts)
  bash:
    description: Run an arbitrary script within a container (or open a shell without deps)
    service: rails
    command: /bin/bash
    compose_run_options: [ no-deps ]

  # A shortcut to run Bundler commands
  bundle:
    description: Run Bundler commands
    service: rails
    command: bundle
    compose_run_options: [ no-deps ]

  # A shortcut to run RSpec
  rspec:
    description: Run RSpec commands
    service: rails
    command: bundle exec rspec

  rails:
    description: Run Rails commands
    service: rails
    command: bundle exec rails
    subcommands:
      s:
        description: Run Rails server at http://localhost:3000
        service: web
        compose:
          run_options: [service-ports, use-aliases]

  yarn:
    description: Run Yarn commands
    service: rails
    command: yarn
    compose_run_options: [ no-deps ]

  ruby-lsp:
    description: Run Ruby LSP
    service: ruby-lsp
    command: bundle exec ruby-lsp
    compose_run_options: [ service-ports, no-deps ]

  psql:
    description: Run Postgres psql console
    service: postgres
    default_args: example_demo_development
    command: psql -h postgres -U postgres

  'redis-cli':
    description: Run Redis console
    service: redis
    command: redis-cli -h redis

  claude:
    description: Run Claude CLI
    service: rails
    command: claude --dangerously-skip-permissions

  'worktree:new':
    description: Create a git worktree with its own Docker env (dip worktree:new <branch> [<base>])
    command: .dockerdev/bin/worktree new
  'worktree:drop':
    description: Remove a git worktree and its Docker env (dip worktree:drop <name-or-path> [--force])
    command: .dockerdev/bin/worktree drop
  'worktree:init':
    description: Set up the Docker env for the current git worktree (runs on checkout automatically)
    command: .dockerdev/bin/worktree init

provision:
  - '[[ "$RESET_DOCKER" == "true" ]] && echo "Re-creating the Docker env from scratch..." && dip compose down --volumes || echo "Re-provisioning the Docker env..."'
  # Volumes shared by the main checkout and git worktrees (`external` in compose.yml)
  - '[[ "$RESET_DOCKER" == "true" ]] && .dockerdev/bin/worktree volumes --reset || .dockerdev/bin/worktree volumes'
  # Git hooks (the post-checkout hook sets up the Docker env for new worktrees)
  - (command -v lefthook > /dev/null && lefthook install) || echo "⚠️  Install lefthook to set up worktrees automatically (or run 'dip worktree:init')"
  - dip compose up -d postgres redis
  - (test -f .dockerdev/.claude.json) || (cp .dockerdev/.claude.json.example .dockerdev/.claude.json)
  - dip bundle check || dip bundle install
  - dip rails db:prepare
  - dip rails db:test:prepare
  - dip yarn
  - dip yarn build:css
  - echo "🚀 Ready to rock!"
